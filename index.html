<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Market Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0b0e11; color: #eaecef; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid #1e2329; }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: .3px; }
  header h1 span { color: #f0b90b; }
  header p { font-size: 12px; color: #848e9c; margin-top: 3px; }
  .tape { border-bottom: 1px solid #1e2329; }
  .section { padding: 12px 12px 4px; }
  .section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #848e9c; margin: 6px 4px 8px; }
  .panel { background: #12161c; border: 1px solid #1e2329; border-radius: 8px; overflow: hidden; }
  .chart-wrap { height: 480px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .grid .panel { height: 560px; }
  footer { padding: 18px 16px 26px; font-size: 11px; color: #5e6673; text-align: center; }
  @media (min-width: 900px) {
    .chart-wrap { height: 560px; }
    .grid { grid-template-columns: 1fr 1fr; }
    .section { padding: 16px 20px 8px; }
  }
  .tradingview-widget-container, .tradingview-widget-container__widget { height: 100%; width: 100%; }
</style>
</head>
<body>

<header>
  <h1>Live <span>Market</span> Dashboard</h1>
  <p>Real-time charts, market overview and heatmap. Tap any chart to explore symbols.</p>
</header>

<div class="tape">
  <div class="tradingview-widget-container" style="height:46px">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
    {
      "symbols": [
        {"proName": "FOREXCOM:SPXUSD", "title": "S&P 500"},
        {"proName": "FOREXCOM:NSXUSD", "title": "Nasdaq 100"},
        {"proName": "FOREXCOM:DJI", "title": "Dow 30"},
        {"proName": "BITSTAMP:BTCUSD", "title": "Bitcoin"},
        {"proName": "BITSTAMP:ETHUSD", "title": "Ethereum"},
        {"proName": "TVC:GOLD", "title": "Gold"},
        {"proName": "TVC:USOIL", "title": "Crude Oil"},
        {"proName": "NASDAQ:AAPL", "title": "Apple"},
        {"proName": "NASDAQ:NVDA", "title": "Nvidia"},
        {"proName": "NASDAQ:TSLA", "title": "Tesla"}
      ],
      "showSymbolLogo": true,
      "colorTheme": "dark",
      "isTransparent": true,
      "displayMode": "adaptive",
      "locale": "en"
    }
    </script>
  </div>
</div>

<div class="section">
  <h2>Chart &mdash; search any stock, ETF or crypto</h2>
  <div class="panel chart-wrap">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
      {
        "autosize": true,
        "symbol": "NASDAQ:AAPL",
        "interval": "D",
        "timezone": "America/Los_Angeles",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "allow_symbol_change": true,
        "withdateranges": true,
        "hide_side_toolbar": false,
        "studies": ["STD;Volume"],
        "support_host": "https://www.tradingview.com"
      }
      </script>
    </div>
  </div>
</div>

<div class="section">
  <div class="grid">
    <div>
      <h2>Market overview</h2>
      <div class="panel">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
          {
            "colorTheme": "dark",
            "dateRange": "1D",
            "showChart": true,
            "locale": "en",
            "width": "100%",
            "height": "100%",
            "largeChartUrl": "",
            "isTransparent": true,
            "showSymbolLogo": true,
            "showFloatingTooltip": true,
            "plotLineColorGrowing": "rgba(41, 191, 126, 1)",
            "plotLineColorFalling": "rgba(246, 70, 93, 1)",
            "gridLineColor": "rgba(42, 46, 57, 0)",
            "scaleFontColor": "rgba(132, 142, 156, 1)",
            "belowLineFillColorGrowing": "rgba(41, 98, 255, 0.12)",
            "belowLineFillColorFalling": "rgba(41, 98, 255, 0.12)",
            "belowLineFillColorGrowingBottom": "rgba(41, 98, 255, 0)",
            "belowLineFillColorFallingBottom": "rgba(41, 98, 255, 0)",
            "symbolActiveColor": "rgba(41, 98, 255, 0.12)",
            "tabs": [
              {"title": "Indices", "symbols": [
                {"s": "FOREXCOM:SPXUSD", "d": "S&P 500"},
                {"s": "FOREXCOM:NSXUSD", "d": "Nasdaq 100"},
                {"s": "FOREXCOM:DJI", "d": "Dow 30"},
                {"s": "INDEX:NKY", "d": "Nikkei 225"},
                {"s": "INDEX:DEU40", "d": "DAX"},
                {"s": "FOREXCOM:UKXGBP", "d": "FTSE 100"}
              ]},
              {"title": "Tech", "symbols": [
                {"s": "NASDAQ:AAPL", "d": "Apple"},
                {"s": "NASDAQ:MSFT", "d": "Microsoft"},
                {"s": "NASDAQ:NVDA", "d": "Nvidia"},
                {"s": "NASDAQ:GOOGL", "d": "Alphabet"},
                {"s": "NASDAQ:AMZN", "d": "Amazon"},
                {"s": "NASDAQ:META", "d": "Meta"},
                {"s": "NASDAQ:TSLA", "d": "Tesla"},
                {"s": "NASDAQ:AMD", "d": "AMD"}
              ]},
              {"title": "Crypto & Commodities", "symbols": [
                {"s": "BITSTAMP:BTCUSD", "d": "Bitcoin"},
                {"s": "BITSTAMP:ETHUSD", "d": "Ethereum"},
                {"s": "TVC:GOLD", "d": "Gold"},
                {"s": "TVC:SILVER", "d": "Silver"},
                {"s": "TVC:USOIL", "d": "WTI Crude"}
              ]}
            ]
          }
          </script>
        </div>
      </div>
    </div>
    <div>
      <h2>S&amp;P 500 heatmap</h2>
      <div class="panel">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
          {
            "exchanges": [],
            "dataSource": "SPX500",
            "grouping": "sector",
            "blockSize": "market_cap_basic",
            "blockColor": "change",
            "locale": "en",
            "symbolUrl": "",
            "colorTheme": "dark",
            "hasTopBar": false,
            "isDataSetEnabled": false,
            "isZoomEnabled": true,
            "hasSymbolTooltip": true,
            "width": "100%",
            "height": "100%"
          }
          </script>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <h2>Top market news</h2>
  <div class="panel" style="height:520px">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
      {
        "feedMode": "all_symbols",
        "colorTheme": "dark",
        "isTransparent": true,
        "displayMode": "regular",
        "width": "100%",
        "height": "100%",
        "locale": "en"
      }
      </script>
    </div>
  </div>
</div>

<footer>
  Market data and charts by TradingView. Free live dashboard - no account needed.
</footer>

</body>
</html>
